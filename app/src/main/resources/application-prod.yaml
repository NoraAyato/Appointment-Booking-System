spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      password: ${SPRING_DATA_REDIS_PASSWORD:}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: false

  mail:
    host: ${SPRING_MAIL_HOST}
    port: ${SPRING_MAIL_PORT:587}
    username: ${SPRING_MAIL_USERNAME}
    password: ${SPRING_MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /api

google:
  oauth:
    client-id: ${GOOGLE_OAUTH_CLIENT_ID}
    client-secret: ${GOOGLE_OAUTH_CLIENT_SECRET}
    redirect-uri: ${GOOGLE_OAUTH_REDIRECT_URI}

momo:
  endpoint: ${MOMO_ENDPOINT}
  partner-code: ${MOMO_PARTNER_CODE}
  access-key: ${MOMO_ACCESS_KEY}
  secret-key: ${MOMO_SECRET_KEY}
  redirect-url: ${MOMO_REDIRECT_URL}
  ipn-url: ${MOMO_IPN_URL}
  request-type: ${MOMO_REQUEST_TYPE:captureWallet}

payment:
  expiration:
    fixed-delay-ms: ${PAYMENT_EXPIRATION_FIXED_DELAY_MS:60000}       # 1 phút
    initial-delay-ms: ${PAYMENT_EXPIRATION_INITIAL_DELAY_MS:60000}    # 1 phút
    unpaid-invoice-minutes: ${PAYMENT_EXPIRATION_MINUTES:15}          # 15 phút
    batch-size: ${PAYMENT_EXPIRATION_BATCH_SIZE:500}

security:
  jwt:
    secret: ${SECURITY_JWT_SECRET}
    reset-secret: ${SECURITY_JWT_RESET_SECRET}
    expiration: ${SECURITY_JWT_EXPIRATION}
    refresh-expiration: ${SECURITY_JWT_REFRESH_EXPIRATION}
    reset-expiration: ${SECURITY_JWT_RESET_EXPIRATION}

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
