spring:
  datasource:
    url: jdbc:h2:mem:appointment_booking_test;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        format_sql: true
  sql:
    init:
      mode: never

  mail:
    host: localhost
    port: 2525

google:
  oauth:
    client-id: test-google-client-id
    client-secret: test-google-client-secret
    redirect-uri: http://localhost/test/oauth/callback
